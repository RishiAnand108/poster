<head>
<meta charset="utf-8">

<title>Hacktoberfest Hack Day — Participant Poster</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f5f5;color:#111}
  .wrap{max-width:1050px;margin:auto;padding:28px 18px 50px}
  h1{margin:0 0 8px;font-size:30px}
  .sub{margin:0 0 22px;color:#555}
  .grid{display:grid;grid-template-columns:minmax(280px,520px) 1fr;gap:28px;align-items:start}
  .card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 30px #00000012}
  canvas{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
  .controls{display:grid;gap:14px}
  .upload{border:2px dashed #bbb;border-radius:14px;padding:22px;text-align:center;background:#fafafa}
  input[type=file]{width:100%}
  button{border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer}
  #download{background:#111;color:#fff}
  #copy{background:#ffd21f;color:#111}
  button:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:13px;color:#666;line-height:1.5}
  textarea{width:100%;min-height:250px;border:1px solid #ddd;border-radius:12px;padding:12px;font:14px/1.5 inherit;resize:vertical}
  .status{font-size:13px;color:#444;min-height:20px}
  @media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hacktoberfest Hack Day — Participant Poster</h1>
  <p class="sub">Upload your event photo, download the finished poster, and copy the LinkedIn caption.</p>

  <div class="grid">
    <div class="card">
      <canvas id="poster" width="1122" height="1402"></canvas>
    </div>

    <div class="controls">
      <div class="card">
        <div class="upload">
          <strong>📸 Upload your photo</strong>
          <p class="hint">Choose a portrait, selfie, or group photo. The photo will be automatically cropped into the poster frame.</p>
          <input id="photo" type="file" accept="image/*">
        </div>
        <br>
        <button id="download" disabled>Download Poster PNG</button>
        <br>
        <button id="copy">Copy LinkedIn Caption</button>
        <div id="status" class="status"></div>
      </div>

      <div class="card">
        <strong>LinkedIn caption</strong>
        <textarea id="caption" readonly>$ git clone hacktoberfest-hack-day-2026

<script>
const canvas = document.getElementById('poster');
const ctx = canvas.getContext('2d');
const photoInput = document.getElementById('photo');
const downloadBtn = document.getElementById('download');
const copyBtn = document.getElementById('copy');
const statusEl = document.getElementById('status');
const caption = document.getElementById('caption');

const bg = new Image();
bg.src = 'assets/poster.png';

let userImg = null;

// Inner photo area of the supplied 1122x1402 poster.
// The yellow border remains part of the original poster.
// Measured from the gray placeholder (x 643–1026, y 251–766), expanded by
// 1px so the anti-aliased edge of the placeholder is fully covered.
const frame = { x: 642, y: 250, w: 386, h: 518, r: 35 };

function roundRectPath(c, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function drawCover(img, x, y, w, h) {
  const scale = Math.max(w/img.width, h/img.height);
  const dw = img.width * scale, dh = img.height * scale;
  const dx = x + (w-dw)/2, dy = y + (h-dh)/2;
  ctx.save();
  roundRectPath(ctx,x,y,w,h,frame.r);
  ctx.clip();
  ctx.drawImage(img,dx,dy,dw,dh);
  ctx.restore();
}

function render() {
  if (!bg.complete) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);
  if (userImg) drawCover(userImg,frame.x,frame.y,frame.w,frame.h);
}

bg.onload = render;

photoInput.addEventListener('change', e => {
  const file = e.target.files?.[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    userImg = img;
    render();
    downloadBtn.disabled = false;
    statusEl.textContent = 'Photo added. You can download the poster now.';
    URL.revokeObjectURL(url);
  };
  img.src = url;
});

downloadBtn.addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = 'hacktoberfest-hack-day-nashik.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(caption.value);
    statusEl.textContent = 'LinkedIn caption copied!';
  } catch {
    caption.select();
    document.execCommand('copy');
    statusEl.textContent = 'LinkedIn caption copied!';
  }
});
</script>
</body>
